server:
  port: 8080

spring:
  application:
    name: spring-cloud-gateway
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  config:
    import:
      - optional:nacos:spring-cloud-shared.yaml
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:sca-dev}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:sca-dev}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          routes:
            - id: auth-service
              uri: lb://spring-cloud-auth
              predicates:
                - Path=/api/auth/**
              filters:
                - name: TraceId
                - name: Path
                - StripPrefix=2
                - name: Log
            - id: system-service
              uri: lb://spring-cloud-system
              predicates:
                - Path=/api/system/**
              filters:
                - name: TraceId
                - name: Path
                - StripPrefix=2
                - name: Log
            - id: article-service
              uri: lb://spring-cloud-article
              predicates:
                - Path=/api/article/**
              filters:
                - name: TraceId
                - name: Path
                - StripPrefix=2
                - name: Log
            - id: comment-service
              uri: lb://spring-cloud-comment
              predicates:
                - Path=/api/comments/**
              filters:
                - name: TraceId
                - name: Path
                - StripPrefix=2
                - name: Log