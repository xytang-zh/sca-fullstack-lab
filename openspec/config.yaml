schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  sca-fullstack-lab：企业级一体化智能管理平台（前后端分离 Monorepo）。
  所有 OpenSpec artifact 使用中文撰写。

  后端 spring-cloud-alibaba/：
    - Spring Cloud Alibaba 2025.0.0.0 + Spring Boot 3.5.0 + JDK 21
    - 1 网关(8080) + 1 认证中心(8081) + 11 业务服务 + 公共层 16 子模块
    - Sa-Token 1.44.0 认证；MyBatis-Plus 3.5.9 ORM；Nacos 注册配置中心
    - 顶层 groupId com.xytang，版本统一在父 POM 声明，子模块禁止覆盖

  前端 vue-web-ui/：
    - Vue 3.5 + Vite + TypeScript + pnpm 9（Monorepo，禁止 npm/yarn）
    - 3 应用：apps/admin(5173)、apps/portal(5174)、apps/flow-web(5175)
    - Naive UI + Pinia + Vue Router + UnoCSS，HTTP 统一走 @sca/api 的 request

  跨端契约（方案设计必须遵守）：
    - 所有 HTTP 接口返回 R<T> 包装：{code, msg, data, timestamp}，code=200 成功
    - 雪花 ID 序列化为 String，前端必须用 string 类型接收，禁止 number
    - 认证头：Authorization(Bearer) 前端→网关；X-Login-Id / X-Trace-Id 网关→下游
    - API 路径 /api/{服务名}/...，RESTful：GET 查询 / POST 新增 / PUT 全量更新 /
      PATCH 部分更新 / DELETE 删除，业务动作用动词子资源

  后端红线（方案中禁止出现）：
    - @Autowired 字段注入 → 必须 @RequiredArgsConstructor 构造器注入
    - throw new RuntimeException → 必须具体业务异常
    - catch (Exception/Throwable) → 必须精确捕获
    - System.out.println / e.printStackTrace()
    - 子模块 POM 覆盖父 POM 声明的依赖版本

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - 控制篇幅，只写必要内容
    - 必须包含 Non-goals 部分
    - 必须明确 affected modules（涉及的后端/前端模块路径）
  design:
    - 使用 ASCII 图表达架构与流程
    - 有取舍的决策必须记录替代方案与选择理由
  specs:
    - 每条需求可独立验证，写清行为与验收标准
    - 需求聚焦契约与行为，不写实现细节
  tasks:
    - 任务粒度不超过 2 小时，一条任务只做一件事
    - 标注所属模块路径与验收命令

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - 按 tasks 顺序实施，每个任务完成后更新状态
      - 涉及前后端契约的任务，两侧都须完成验证
  archive:
    guidance:
      - 归档前确认主 specs 已同步 delta specs
