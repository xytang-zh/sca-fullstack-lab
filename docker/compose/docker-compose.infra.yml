name: sca-infra

# MVP 第一批次预览用基础设施：MySQL 8.4 + Redis 7.4 + Nacos 2.4 standalone
# 端口/账号与后端 application.yml 默认值对齐（spring-cloud-alibaba/CLAUDE.md §10 + §3）

services:
  mysql:
    image: mysql:8.4.3
    container_name: sca-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sca_system
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4.2
    container_name: sca-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "rootpass"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rootpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: sca-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # === 认证（改造前 NACOS_AUTH_ENABLE=false，任意可读写）===
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN_SECRET_KEY: ${NACOS_AUTH_TOKEN_SECRET_KEY:?必须在 .env 设置}
      # 兼容：Nacos 2.4.3 镜像默认 application.properties 读取旧变量名 NACOS_AUTH_TOKEN
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN_SECRET_KEY:?必须在 .env 设置}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?必须在 .env 设置}
      NACOS_AUTH_ENABLE_USER_AGENT_AUTH_WHITE: "false"
      # === MySQL 持久化（改造前 Derby 内嵌，容器重建即丢配置）===
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?必须在 .env 设置}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      JVM_XMS: 512m
      JVM_Xmx: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  nacos-logs:
